<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>playground</title>
    <meta name="description" content="이것저것 만들어 보는 곳" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1117;
        --fg: #e6edf3;
        --muted: #8b949e;
        --line: #232a33;
        --accent: #d9c9a3;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          'Malgun Gothic', system-ui, sans-serif;
        line-height: 1.7;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 72px 24px 96px;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .lede {
        margin: 8px 0 44px;
        color: var(--muted);
        font-size: 14px;
      }
      h2 {
        margin: 0 0 14px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      a.card {
        display: block;
        padding: 20px 22px;
        border: 1px solid var(--line);
        border-radius: 12px;
        text-decoration: none;
        color: inherit;
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      a.card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }
      .title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .sub {
        margin-top: 6px;
        font-size: 13px;
        color: var(--muted);
      }
      .tags {
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tag {
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 9px;
      }
      footer {
        margin-top: 56px;
        font-size: 12px;
        color: var(--muted);
      }
      footer a { color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>playground</h1>
      <p class="lede">이것저것 만들어 보는 곳.</p>

      <h2>Games</h2>
      <a class="card" href="./joseon-defense/">
        <div class="title">조선 방어전</div>
        <div class="sub">
          왜구의 노략에서 병자호란까지, 여섯 전쟁으로부터 성을 지키는 경로형 타워디펜스
        </div>
        <div class="tags">
          <span class="tag">TypeScript</span>
          <span class="tag">Canvas</span>
          <span class="tag">엔진 없음</span>
          <span class="tag">시뮬레이터로 잡은 밸런스</span>
        </div>
      </a>

      <footer>
        <a href="https://github.com/AJ-yang/playground">github.com/AJ-yang/playground</a>
      </footer>
    </main>
  </body>
</html>
