<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>족장 — Chieftain</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
        --fg: #e6edf3;
        --muted: #8b949e;
        --p0: #7fb2ff;
        --p1: #ff8a6b;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          'Malgun Gothic', system-ui, sans-serif;
        user-select: none;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }

      /* HUD는 캔버스 위에 얹는 DOM이다. 3D 안에 글자를 그리는 것보다
         읽기 쉽고, 부감/1인칭 어느 쪽에서도 같은 코드로 쓸 수 있다. */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-size: 13px;
        line-height: 1.5;
      }
      #hud .panel {
        position: absolute;
        background: rgba(10, 14, 20, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 8px;
        padding: 10px 12px;
        backdrop-filter: blur(6px);
      }
      #hud .top-left { top: 12px; left: 12px; min-width: 190px; }
      #hud .top-right { top: 12px; right: 12px; text-align: right; }
      #hud .bottom-left { bottom: 12px; left: 12px; }

      /* 미니맵은 #hud 바깥에 둔다. Hud가 매 프레임 innerHTML을 갈아엎기
         때문에, 안에 있으면 캔버스가 프레임마다 새로 생긴다. */
      #minimap {
        position: fixed;
        right: 12px;
        bottom: 12px;
        padding: 6px;
        background: rgba(10, 14, 20, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 8px;
        backdrop-filter: blur(6px);
        line-height: 0;
      }
      /* 고른 부대의 상태 — 조작 안내 바로 위. */
      #hud .bottom-sel {
        bottom: 74px; left: 50%; transform: translateX(-50%);
        min-width: 260px; max-width: 460px; text-align: center;
      }
      #hud .sel-head { margin-bottom: 4px; }
      #hud .sel-bars { display: flex; align-items: center; justify-content: center; gap: 8px; }
      #hud .sel-grid {
        display: inline-grid;
        grid-template-columns: repeat(3, auto auto);
        gap: 2px 6px;
        margin-top: 4px;
        font-size: 12px;
      }
      #hud .sel-grid > .muted:not(:first-child) { margin-left: 8px; }
      #hud .sel-note { font-size: 11px; margin-top: 4px; }
      #hud .bar {
        display: inline-block;
        width: 140px; height: 7px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #hud .bar > i { display: block; height: 100%; }

      /* 드래그 상자. 3D가 아니라 DOM이라 픽셀에 딱 맞고 공짜다. */
      #selbox {
        position: fixed;
        display: none;
        border: 1px solid rgba(232, 240, 247, 0.9);
        background: rgba(232, 240, 247, 0.12);
        pointer-events: none;
        z-index: 5;
      }

      #hud .bottom-center {
        bottom: 12px; left: 50%; transform: translateX(-50%);
        text-align: center; color: var(--muted);
        /* 한 줄로 유지한다. 두 줄이 되면 위의 부대 패널을 밀어 올려 겹친다. */
        white-space: nowrap;
        max-width: calc(100vw - 24px);
        overflow: hidden;
      }
      #hud b { font-weight: 600; }
      #hud .k {
        display: inline-block;
        min-width: 18px;
        padding: 0 5px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 4px;
        font-size: 11px;
        text-align: center;
      }
      #hud .row { display: flex; justify-content: space-between; gap: 14px; }
      #hud .muted { color: var(--muted); }
      #hud .p0 { color: var(--p0); }
      #hud .p1 { color: var(--p1); }
      #hud .btn { pointer-events: auto; cursor: pointer; }

      #banner {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: rgba(6, 9, 13, 0.82);
        text-align: center;
      }
      #banner.show { display: grid; }
      #banner h1 { margin: 0 0 8px; font-size: 40px; letter-spacing: -0.02em; }
      #banner p { margin: 0 0 20px; color: var(--muted); max-width: 32em; }
      #banner button {
        font: inherit;
        color: var(--fg);
        background: rgba(255, 255, 255, 0.09);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        padding: 10px 22px;
        cursor: pointer;
      }
      #banner button:hover { background: rgba(255, 255, 255, 0.16); }
      #banner .keys { margin-top: 22px; color: var(--muted); font-size: 13px; }
      #banner .keys div { margin: 3px 0; }
      /* 조작 안내 안에서 한 단계 더 물러나는 부연. */
      #banner .keys .dim { opacity: 0.6; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="minimap"></div>
    <div id="selbox"></div>
    <div id="banner"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
