<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>조선 방어전 — Joseon War Tower Defense</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1117;
        --fg: #e6edf3;
        --muted: #8b949e;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          'Malgun Gothic', system-ui, sans-serif;
      }
      #app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px;
      }
      canvas {
        display: block;
        max-width: 100%;
        border-radius: 10px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
        touch-action: none;
        cursor: pointer;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.02em;
        text-align: center;
        line-height: 1.7;
      }
      kbd {
        background: #21262d;
        border: 1px solid #30363d;
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 11px;
        font-family: inherit;
      }
      .mode-link {
        display: inline-block;
        margin-top: 4px;
        padding: 7px 16px;
        border: 1px solid #33587c;
        border-radius: 7px;
        background: #1d3247;
        color: #cfe3f5;
        font-size: 12.5px;
        text-decoration: none;
      }
      .mode-link:hover { background: #244062; }
      .mode-link span { color: #8b949e; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <p class="hint">
        <strong>스테이지 선택</strong> — 숫자키로 바로 진입 &nbsp;·&nbsp; 전쟁을 하나씩 넘길 때마다 그 시대의 기물이 열립니다<br />
        <strong>플레이 중</strong> — <kbd>1</kbd>–<kbd>8</kbd> 기물 선택 &nbsp;·&nbsp;
        <kbd>Space</kbd> 다음 웨이브 &nbsp;·&nbsp; <kbd>U</kbd>/<kbd>X</kbd>/<kbd>T</kbd> 강화·철수·타겟팅 &nbsp;·&nbsp;
        <kbd>P</kbd> 일시정지 &nbsp;·&nbsp; <kbd>R</kbd> 재시작 &nbsp;·&nbsp; <kbd>Q</kbd> 스테이지 선택으로
      </p>
      <a class="mode-link" href="./fps.html">
        1인칭 전장으로 들어가기 (3D) <span>— 같은 판을 사람 눈높이에서</span>
      </a>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
