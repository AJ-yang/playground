# GitHub Pages 배포.
#
# **저장소 구조를 그대로 주소로 옮긴다.** 저장소가 갈래(Games/)별로 프로젝트를
# 담고 있으므로 배포도 같은 모양이 되어야 나중에 프로젝트를 늘릴 때 주소가
# 흐트러지지 않는다.
#
#   Games/joseon-defense/dist            →  /playground/joseon-defense/
#   Games/casino-learning-game/index.html →  /playground/casino-learning-game/
#   Services/gyeol/out                   →  /playground/gyeol/
#   Services/volleyball-rotation/index.html → /playground/volleyball-rotation/
#   site/index.html                      →  /playground/
#
# 프로젝트 사이트의 첫 칸(/playground/)은 저장소 이름이라 바꿀 수 없다. 대신
# 그 아래를 저장소 구조와 맞춰 두면 주소에 프로젝트 이름이 드러난다.
#
# 게임은 정적 파일 뭉치라(에셋 로딩도 서버도 없다) dist를 그대로 올리면 된다.
# vite 설정의 `base: './'`가 상대 경로를 쓰므로 몇 단계 아래에 놓여도 그대로
# 동작한다.
#
# **프로젝트마다 빌드가 있는 것은 아니다.** 조선 방어전은 vite로 dist를 굽지만
# 카지노 학습 게임은 HTML 한 장이 곧 게임이라 빌드 단계가 없다. 결은 Next.js
# 정적 내보내기라 dist도 아닌 out을 굽고, 주소가 빌드 시점에 basePath로 박히기
# 때문에 빌드 명령에 경로가 들어간다. 그래서 조립은 "dist를 올린다"가 아니라
# **프로젝트마다 올릴 것을 따로 적는다**로 둔다 — 갈래 폴더를 훑어서
# 자동화하면 이 차이를 못 담는다.

name: 배포

on:
  push:
    branches: [main]
  # 브랜치를 건드리지 않고 다시 올리고 싶을 때를 위해 수동 실행도 열어 둔다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 앞선 것을 중간에 끊으면 안 된다 — 취소하지 않고 줄을 세운다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            Games/joseon-defense/package-lock.json
            Services/gyeol/package-lock.json

      - run: npm ci
        working-directory: Games/joseon-defense

      # `npm run build`가 tsc --noEmit을 먼저 돌리므로 타입 검사도 여기 포함된다.
      # 밸런스 게이트는 verify.yml이 같은 푸시에서 따로 돌린다.
      - name: 조선 방어전 빌드
        run: npm run build
        working-directory: Games/joseon-defense

      - run: npm ci
        working-directory: Services/gyeol

      # basePath가 빌드 시점에 박힌다 — 주소를 바꾸려면 다시 구워야 한다.
      # 경로는 package.json의 build:pages에 적혀 있다(/playground/gyeol).
      # 색인(public/catalog.json)은 TMDB 키가 있어야 만들 수 있어서 커밋해 뒀다.
      - name: 결 빌드
        run: npm run build:pages
        working-directory: Services/gyeol

      # 프로젝트가 늘어나면 여기에 한 줄씩 붙인다.
      - name: 배포 트리 조립
        run: |
          mkdir -p _site/joseon-defense
          cp -r Games/joseon-defense/dist/. _site/joseon-defense/
          # 카지노 학습 게임은 빌드 산출물이 없다 — HTML 한 장이 곧 게임이라
          # dist가 아니라 소스를 그대로 올린다.
          mkdir -p _site/casino-learning-game
          cp Games/casino-learning-game/index.html _site/casino-learning-game/
          # 결의 out/에는 .nojekyll 같은 숨김 파일이 있으므로 `.`로 끝내
          # 딸려 오게 한다. (이 저장소는 deploy-pages로 올리므로 Jekyll이
          # 돌지 않는다 — .nojekyll은 없어도 되지만 있어도 해가 없다.)
          mkdir -p _site/gyeol
          cp -r Services/gyeol/out/. _site/gyeol/
          # 배구 로테이션 보드도 HTML 한 장이다. 폰트와 html2canvas는 CDN에서
          # 받으므로 같이 올릴 것이 없다.
          mkdir -p _site/volleyball-rotation
          cp Services/volleyball-rotation/index.html _site/volleyball-rotation/
          cp site/index.html _site/index.html
          # 조립 결과를 로그에 남긴다. 결만 800개가 넘어서 개수만 센다.
          find _site -type f | wc -l
          find _site -maxdepth 2 -not -path '*/_next/*' | sort

      # Pages는 저장소 설정(Settings → Pages → Source: GitHub Actions)에서 켜 둔다.
      # `enablement: true`로 워크플로가 켜게 해 봤지만 기본 토큰에는 사이트를
      # 만들 권한이 없어(Resource not accessible by integration) 항상 실패했다.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
