# 이 저장소에는 단위 테스트가 없다. 회귀를 잡아 온 것은 헤드리스 시뮬레이터였고,
# 실제로 세 번의 "지을수록 진다" 회귀를 전부 시뮬레이터가 찾았다. 사람이 기억해서
# 돌려야 한다는 게 그 구조의 유일한 약점이라, 그 판단을 여기로 옮긴다.
#
# 밸런스 게이트가 무엇을 지키는지는 src/sim/gate.ts에 규칙으로 적혀 있다.

name: 검증

on:
  push:
    branches: ['**']
  pull_request:

# 같은 브랜치에 새 커밋이 올라오면 진행 중이던 검사는 취소한다.
# 밸런스 게이트가 1분 가까이 걸려서 쌓이면 낭비가 크다.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # 게임은 저장소 루트가 아니라 joseon-defense/ 안에 있다.
    working-directory: joseon-defense

jobs:
  verify:
    # 같은 저장소의 브랜치는 push와 pull_request가 **둘 다** 발화해서 같은
    # 커밋을 두 번 검사한다(concurrency로도 안 묶인다 — 두 이벤트의 ref가
    # 다르기 때문이다). push 쪽 하나로 돌리고, push 이벤트가 없는 포크발
    # PR만 pull_request 쪽으로 받는다.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: joseon-defense/package-lock.json

      - run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 빌드
        run: npm run build

      # 시뮬레이터는 시드가 고정된 결정적 구조라 러너가 달라도 같은 숫자가 나온다.
      # 어긋나면 종료 코드 1로 떨어진다.
      - name: 밸런스 회귀 게이트
        run: npm run balance
